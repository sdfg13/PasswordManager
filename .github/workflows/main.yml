name: CI Password Safe

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        # Системные пакеты для работы PyQt5 в изолированной среде Linux
        sudo apt-get update
        sudo apt-get install -y libxcb-xinerama0 xvfb

    - name: Run Pytest with Coverage
      env:
        PYTHONPATH: src
      run: |
        # Запуск через xvfb-run страхует инициализацию модулей PyQt5
        xvfb-run python -m pytest tests --cov=src --cov-report=term-missing
